name: Build Odin15 Kernel 5.4
on:
  workflow_dispatch: # 手动运行
  push:
    branches: [ main ] # 核对你的源码分支

env:
  DEFCONFIG: gki_defconfig
  ARCH: arm64
  TC_LINK: https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang+llvm-14.0.6-x86_64-linux-gnu.tar.xz
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y build-essential git ccache flex bison libelf-dev bc zip unzip wget curl openssl python3

      - name: Download Clang 14 Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget ${{ env.TC_LINK }}
          tar -xf *.tar.xz
          mv clang+llvm-14.0.6-x86_64-linux-gnu clang
          echo "PATH=${{ github.workspace }}/toolchain/clang/bin:$PATH" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: odin15-clang14-${{ github.ref_name }}

      - name: Config ccache
        run: |
          ccache -M 10G
          echo "CCACHE_DIR=~/.ccache" >> $GITHUB_ENV

      - name: Generate defconfig
        run: |
          make O=out ${{ env.DEFCONFIG }}

      - name: Start Compile
        run: |
          make -j$(nproc) O=out \
            CC="ccache clang" \
            LLVM=1 \
            KCFLAGS=-Wno-error

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL_REPO }} anykernel
          rm -rf anykernel/Image anykernel/dtbo.img
          cp out/arch/arm64/boot/Image anykernel/
          cp out/arch/arm64/boot/dtbo.img anykernel/

      - name: Build Flash Zip
        run: |
          cd anykernel
          zip -r9 Odin15-Kernel-${{ github.sha }}.zip *
          mv Odin15-Kernel-${{ github.sha }}.zip ${{ github.workspace }}/

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Odin15-Kernel-Build
          path: Odin15-Kernel-*.zip
